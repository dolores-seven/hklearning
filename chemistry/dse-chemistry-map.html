<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSE Chemistry Knowledge Map · DSE化学全景知识图谱</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel2: #273449;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #6366f1;
    --line: #334155;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; }
  body {
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
  }
  #app { display:flex; height:100vh; }

  /* ---------- 左侧工具栏 ---------- */
  #sidebar {
    width: 300px; min-width: 300px; height:100%;
    background: var(--panel); border-right:1px solid var(--line);
    display:flex; flex-direction:column; overflow-y:auto;
  }
  .brand { padding:16px 16px 10px; border-bottom:1px solid var(--line); }
  .brand h1 { font-size:17px; font-weight:700; letter-spacing:.5px; }
  .brand .sub { font-size:11px; color:var(--muted); margin-top:4px; line-height:1.5; }
  .block { padding:12px 16px; border-bottom:1px solid var(--line); }
  .block h3 { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }

  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip {
    padding:4px 10px; border-radius:12px; font-size:12px; cursor:pointer;
    border:1px solid var(--line); background:var(--panel2); color:var(--text);
    user-select:none; transition:all .15s;
  }
  .chip:hover { border-color:var(--accent); }
  .chip.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .chip .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; vertical-align:1px; }

  .btnrow { display:flex; gap:8px; flex-wrap:wrap; }
  button.b {
    padding:6px 12px; font-size:12px; border-radius:6px; cursor:pointer;
    border:1px solid var(--line); background:var(--panel2); color:var(--text);
  }
  button.b:hover { border-color:var(--accent); }
  button.b.on { background:var(--accent); border-color:var(--accent); color:#fff; }

  .legend { display:flex; flex-direction:column; gap:6px; font-size:12px; color:var(--muted); }
  .legend .li { display:flex; align-items:center; gap:8px; }
  .legend svg { width:26px; height:10px; flex:none; }
  .legend .tag { font-size:10px; padding:1px 6px; border-radius:8px; background:var(--panel2); color:var(--muted); }
  .legend .dot { width:12px; height:12px; border-radius:50%; display:inline-block; flex:none; }
  .legend .lg-cap { font-size:10px; color:var(--muted); letter-spacing:1px; text-transform:uppercase; margin-top:6px; }
  .legend .edge-toggle { cursor:pointer; user-select:none; }
  .legend .edge-toggle.off { opacity:.35; }

  input.search {
    width:100%; padding:7px 10px; font-size:13px; border-radius:6px;
    border:1px solid var(--line); background:var(--panel2); color:var(--text); outline:none;
  }
  input.search:focus { border-color:var(--accent); }

  .statline { font-size:11px; color:var(--muted); line-height:1.7; }

  /* ---------- 主画布 ---------- */
  #stage { flex:1; position:relative; overflow:hidden; }
  #stage svg { width:100%; height:100%; display:block; cursor:grab; }
  #stage svg:active { cursor:grabbing; }
  .hint {
    position:absolute; left:14px; bottom:12px; font-size:11px; color:var(--muted);
    background:rgba(15,23,42,.75); padding:5px 10px; border-radius:6px; pointer-events:none;
  }

  /* ---------- 详情面板 ---------- */
  #detail {
    position:absolute; top:12px; right:12px; width:340px; max-height:calc(100% - 24px);
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    overflow-y:auto; display:none; box-shadow:0 8px 30px rgba(0,0,0,.5);
  }
  #detail .dhead { padding:14px 16px 10px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--panel); }
  #detail .dhead .dtype { font-size:10px; color:var(--muted); letter-spacing:1px; text-transform:uppercase; }
  #detail .dhead h2 { font-size:16px; margin-top:3px; }
  #detail .dhead .en { font-size:12px; color:var(--muted); margin-top:2px; font-style:italic; }
  #detail .dhead .close { position:absolute; top:10px; right:12px; cursor:pointer; color:var(--muted); font-size:18px; }
  #detail .dhead .close:hover { color:#fff; }
  #detail .sec { padding:12px 16px; border-bottom:1px solid rgba(51,65,85,.5); }
  #detail .sec h4 { font-size:11px; color:var(--muted); letter-spacing:1px; margin-bottom:8px; text-transform:uppercase; }
  #detail .formula-box {
    background:var(--panel2); border:1px solid var(--line); border-radius:8px;
    padding:10px 12px; font-family:Georgia, "Times New Roman", serif; font-size:15px;
    overflow-x:auto; margin-bottom:8px;
  }
  #detail .pitfall { font-size:12.5px; line-height:1.7; color:#fbbf24; }
  #detail .leafitem { padding:7px 0; border-bottom:1px dashed rgba(51,65,85,.6); font-size:13px; }
  #detail .leafitem:last-child { border-bottom:none; }
  #detail .leafitem .fname { font-weight:600; }
  #detail .kttag { font-size:9px; padding:1px 5px; border-radius:6px; border:1px solid; margin-left:6px; vertical-align:1px; }
  #detail .leafitem .fen { color:var(--muted); font-size:11px; font-style:italic; margin-left:6px; }
  #detail .leafitem .fformula { font-family:Georgia,serif; font-size:14px; margin-top:3px; color:#93c5fd; }
  #detail .leafitem .fpit { font-size:11.5px; color:#fbbf24; margin-top:3px; }
  #detail .relrow { display:flex; gap:6px; flex-wrap:wrap; align-items:center; padding:4px 0; }
  #detail .relrow .rtype { font-size:10px; padding:1px 7px; border-radius:8px; border:1px solid; }
  #detail .relrow .rname { font-size:12.5px; cursor:pointer; }
  #detail .relrow .rname:hover { color:#93c5fd; }
  #detail .mp { padding:8px 0; border-bottom:1px dashed rgba(51,65,85,.6); }
  #detail .mp:last-child { border-bottom:none; }
  #detail .mp-title { font-size:13px; font-weight:600; color:#fbbf24; }
  #detail .mp-stem { font-size:12px; color:var(--text); margin-top:4px; line-height:1.6; }
  #detail .mp-skel { font-size:11.5px; color:#93c5fd; margin-top:4px; line-height:1.6; }
  #detail .mp-var { font-size:11.5px; color:#6ee7b7; margin-top:4px; line-height:1.6; }
  #detail .mp-variants { margin-top:6px; border-top:1px dashed rgba(51,65,85,.5); padding-top:5px; }
  #detail .mp-vtag { font-size:9px; padding:1px 5px; border-radius:6px; border:1px solid; margin-left:4px; vertical-align:1px; }
  #detail .mp-v { font-size:11.5px; margin:4px 0; line-height:1.5; }
  #detail .mp-v summary { cursor:pointer; color:#93c5fd; font-size:11.5px; }
  #detail .mp-v .vstem { color:var(--text); }
  #detail .mp-v .vans { color:#6ee7b7; margin-top:3px; padding-left:10px; border-left:2px solid #334155; }
  #detail .mp-group { font-size:10px; color:var(--muted); letter-spacing:1px; text-transform:uppercase; margin:6px 0 2px; }
  #detail .meta-row { display:flex; gap:6px; flex-wrap:wrap; margin-top:2px; }
  #detail .tag2 { font-size:10px; padding:2px 8px; border-radius:8px; background:var(--panel2); color:var(--muted); }

  /* 图上节点 */
  .node circle { stroke-width:1.5; cursor:pointer; transition:filter .15s; }
  .node circle:hover { filter: brightness(1.3); }
  .node text {
    font-size:11px; fill:#e2e8f0; pointer-events:none; text-anchor:middle;
    paint-order:stroke; stroke:#0f172a; stroke-width:3px; stroke-linejoin:round;
  }
  .node text.en { font-size:9.5px; }
  .node .halo { fill:none; }
  .link { fill:none; stroke-opacity:.55; }
  .link.dim { stroke-opacity:.06; }
  .node.dim circle { opacity:.15; }
  .node.dim text { opacity:.25; }
  .node text.dim { opacity:.25; }

  @media (max-width: 900px) {
    #sidebar { width:240px; min-width:240px; }
    #detail { width:calc(100vw - 260px); }
  }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div class="brand">
      <h1 id="ui-title">DSE 化学 · 全景知识图谱</h1>
      <div class="sub" id="ui-sub">必修(12单元) + 選修(3選2) + SBA · 课题级骨架<br>点击节点看详情 · 双击课题下钻公式</div>
    </div>

    <div class="block">
      <h3 id="ui-t-view">视图模块</h3>
      <div class="btnrow" id="module-btns">
        <button class="b on" data-mod="all" id="ui-mod-all">全部</button>
        <button class="b" data-mod="core" id="ui-mod-core">必修</button>
        <button class="b" data-mod="elective" id="ui-mod-elective">選修</button>
        <button class="b" data-mod="sba" id="ui-mod-sba">SBA</button>
      </div>
    </div>

    <div class="block">
      <h3 id="ui-t-filter">年级过滤</h3>
      <div class="chips" id="grade-chips">
        <span class="chip on" data-grade="S4">中四 S4</span>
        <span class="chip on" data-grade="S5">中五 S5</span>
        <span class="chip on" data-grade="S6">中六 S6</span>
      </div>
    </div>

    <div class="block">
      <h3 id="ui-t-lang">语言 / Language</h3>
      <div class="btnrow">
        <button class="b on" id="lang-zh">中文</button>
        <button class="b" id="lang-en">English</button>
      </div>
    </div>

    <div class="block">
      <h3 id="ui-t-search">搜索</h3>
      <input class="search" id="search" placeholder="知识点名称… (如 判别式 / circle)">
    </div>

    <div class="block">
      <h3 id="ui-t-legend">图例</h3>
      <div class="legend" id="legend"></div>
    </div>

    <div class="block">
      <div class="statline" id="stats"></div>
    </div>
  </div>

  <div id="stage">
    <svg id="svg"></svg>
    <div class="hint" id="hint">拖拽平移 · 滚轮缩放 · 单击节点看详情(自动高亮关联) · 双击课题展开公式 · 空白关闭</div>
  </div>

  <div id="detail"></div>
</div>

<script src="graph-data.js"></script>
<script>
/* ============================================================
 * Renderer: hand-rolled force-directed layout on SVG
 * 零依赖：力导向 + 缩放平移 + 下钻 + 双语 + 过滤 + 搜索
 * ============================================================ */
(function () {
  const G = DSE_CHEM_GRAPH;
  const svg = document.getElementById('svg');
  const detailEl = document.getElementById('detail');

  /* ---------- i18n ---------- */
  let LANG = 'zh';
  const T = {
    viewModule:  { zh:'视图模块', en:'Module view' },
    gradeFilter: { zh:'年级过滤', en:'Grade filter' },
    search:      { zh:'搜索', en:'Search' },
    legendT:     { zh:'图例', en:'Legend' },
    domainT:     { zh:'范畴', en:'Domain' },
    edgeT:       { zh:'关系', en:'Relations' },
    topic:       { zh:'课题', en:'Topic' },
    leafW:       { zh:'公式/知识点', en:'Formula / Concept' },
    formulas:    { zh:'基础公式', en:'Key formulas' },
    pitfalls:    { zh:'难点·易错点', en:'Pitfalls' },
    leaves:      { zh:'下钻：公式级知识点', en:'Drill-down: formula leaves' },
    relations:   { zh:'关联知识点', en:'Related topics' },
    noRel:       { zh:'（暂无关联数据）', en:'(no relations yet)' },
    grade:       { zh:'年级', en:'Grades' },
    weight:      { zh:'考频', en:'Exam weight' },
    difficulty:  { zh:'难度', en:'Difficulty' },
    examFreq:    { zh:'考试频率', en:'Exam frequency' },
    examSec:     { zh:'主要出题位置', en:'Main section' },
    marks:       { zh:'卷一占分', en:'Marks (P1)' },
    marksNote:   { zh:'出题说明', en:'Exam note' },
    weightMap:   { zh:{ high:'高频', mid:'中频', low:'低频' }, en:{ high:'High', mid:'Mid', low:'Low' } },
    expandHint:  { zh:'双击展开公式', en:'Double-click to expand' },
    collapseHint:{ zh:'双击收起', en:'Double-click to collapse' },
    searchPh:    { zh:'知识点名称… (如 判别式 / circle)', en:'Topic name… (e.g. discriminant / circle)' },
    hint:        { zh:'拖拽平移 · 滚轮缩放 · 单击节点看详情(自动高亮关联) · 双击课题展开公式 · 空白关闭',
                   en:'Drag to pan · wheel to zoom · click node = details (highlights neighbours) · dbl-click topic = formulas · click blank to close' },
    nodesShown:  { zh:'显示', en:'Showing' },
    topicsWord:  { zh:'课题', en:'topics' },
    leavesWord:  { zh:'公式叶', en:'formula leaves' },
    edgesWord:   { zh:'关系边', en:'edges' },
    evidenceW:   { zh:'出题证据', en:'Exam evidence' },
    coTested:    { zh:'组合出题', en:'Co-tested' },
    motherP:     { zh:'母题', en:'Mother problems' },
    asCore:      { zh:'作为主角', en:'As core topic' },
    asRelated:   { zh:'作为配角', en:'As related topic' },
    variants:    { zh:'变式题', en:'Variants' },
    diffBasic:   { zh:'基础', en:'Basic' },
    diffInt:     { zh:'进阶', en:'Intermediate' },
    diffChal:    { zh:'挑战', en:'Challenge' },
    diffComp:    { zh:'综合', en:'Comprehensive' },
    diffCalc:    { zh:'计算', en:'Calculation' },
    diffConcept: { zh:'概念', en:'Concept' },
    diffExp:     { zh:'实验', en:'Experiment' },
    vAnswer:     { zh:'答案', en:'Answer' },
    stem:        { zh:'题干', en:'Stem' },
    solution:    { zh:'解法骨架', en:'Solution skeleton' },
    variation:   { zh:'变式方向', en:'Variations' },
    appears:     { zh:'出现记录', en:'Appearances' },
    edgeToggle:  { zh:'点击图例中的边可开关', en:'Click an edge in the legend to toggle' },
    freqHighlight: { zh:'频率高亮', en:'Frequency highlight' },
    freqHighlightHint: { zh:'节点边框颜色→考试频率', en:'Node border color → exam frequency' },
    beginnerMode: { zh:'新手模式', en:'Beginner mode' },
    beginnerHint: { zh:'只看必修基础(S4/S5) · 前置学习链 · 必背公式', en:'Core only (S4/S5) · learning path · must-memorise formulas' },
  };
  const t = k => T[k][LANG];
  const nm = o => typeof o === 'string' ? o : (o ? (o[LANG] || o.zh || o.en || '') : '');
  const domColor = id => (G.domains.find(d=>d.id===id)||{}).color || '#888';
  const domName  = id => nm((G.domains.find(d=>d.id===id)||{}).code);
  const ktColor  = kt => (G.meta.knowledgeTypes[kt]||{}).color || '#a5b4fc';
  const ktName   = kt => nm(G.meta.knowledgeTypes[kt]);

  /* ---------- state ---------- */
  let moduleView = 'all';                    // all | core | M2
  let grades = new Set(['S4','S5','S6']);
  let beginnerMode = false;                  // 新手模式：只看必修基础+学习链+必背公式
  let expanded = new Set();                  // expanded topic ids
  let selected = null;
  let searchTerm = '';
  let focusId = null;                        // 焦点辐射中心（选中时高亮其邻居）
  let edgeVis = { prereq:true, derives:true, related:true, cotested:true, child:true };
  let frequencyHighlight = false;            // 频率高亮模式：节点边框映射到 examFrequency
  let simNodes = [], simEdges = [];          // simulation model
  let alpha = 1;
  const domGroup = id => (G.domains.find(d=>d.id===id)||{}).group;
  const inModule = n => moduleView==='all' || domGroup(n.domain)===moduleView;
  const inGrades = n => n.grades.some(g => grades.has(g));
  // 新手模式：只显示必修 + S4/S5 的基础课题（隐藏 S6 复习性课题与选修/SBA）
  const beginnerOK = n => domGroup(n.domain)==='core' && (n.grades.includes('S4')||n.grades.includes('S5'));
  const visibleNode = n => inModule(n) && inGrades(n) && !(beginnerMode && !beginnerOK(n));

  /* ---------- build simulation model ---------- */
  const leafParent = {};
  G.nodes.forEach(n => (n.leaves||[]).forEach(l => leafParent[l.id] = n.id));

  function buildModel() {
    simNodes = []; simEdges = [];
    const addTopic = n => {
      simNodes.push({ id:n.id, ref:n, level:'topic', x:n._x||(Math.random()*600-300), y:n._y||(Math.random()*400-200), vx:0, vy:0 });
    };
    G.nodes.forEach(n => { if (inModule(n) && !(beginnerMode && !beginnerOK(n))) addTopic(n); });

    const has = id => simNodes.some(s=>s.id===id);
    G.edges.forEach(e => {
      if (beginnerMode && e.type!=='prereq') return;   // 新手模式：只保留前置学习链
      if (has(e.from) && has(e.to) && e.from!==e.to) {
        simEdges.push({ source:e.from, target:e.to, type:e.type, evidence:e.evidence });
      }
    });

    // expanded leaves as extra nodes, tethered to parent
    G.nodes.forEach(n => {
      if (expanded.has(n.id) && (n.leaves||[]).length && inModule(n)) {
        const p = simNodes.find(s=>s.id===n.id);
        (n.leaves).forEach((l,i) => {
          const ang = (i / n.leaves.length) * Math.PI*2 - Math.PI/2;
          simNodes.push({
            id:l.id, ref:l, level:'leaf', parent:n.id,
            x:p.x + 60*Math.cos(ang), y:p.y + 60*Math.sin(ang),
            vx:0, vy:0
          });
        });
      }
    });

    // leaf ↔ parent tether edges (invisible structurally, drawn lighter)
    simNodes.filter(s=>s.level==='leaf').forEach(s => {
      simEdges.push({ source:s.parent, target:s.id, type:'child' });
    });

    alpha = 1;
  }

  /* ---------- force simulation ---------- */
  function tick() {
    const N = simNodes.length;
    if (!N) return;
    // repulsion (O(n^2), fine for <400)
    for (let i=0;i<N;i++) {
      const a = simNodes[i];
      for (let j=i+1;j<N;j++) {
        const b = simNodes[j];
        let dx=b.x-a.x, dy=b.y-a.y;
        let d2=dx*dx+dy*dy;
        if (d2<1) { dx=(Math.random()-.5); dy=(Math.random()-.5); d2=1; }
        if (d2>250000) continue;               // cutoff 500px
        const d=Math.sqrt(d2);
        const sameDom = a.ref.domain===b.ref.domain;
        const rep = 2200 * (sameDom?0.8:1.1);
        const f = rep/d2 * alpha;
        const fx=dx/d*f, fy=dy/d*f;
        a.vx-=fx; a.vy-=fy; b.vx+=fx; b.vy+=fy;
      }
    }
    // springs
    simEdges.forEach(e => {
      const s=simNodes.find(x=>x.id===e.source), t2=simNodes.find(x=>x.id===e.target);
      if(!s||!t2) return;
      let dx=t2.x-s.x, dy=t2.y-s.y;
      const d=Math.sqrt(dx*dx+dy*dy)||1;
      let k = 0.02, len = e.type==='child' ? 70 : 150;
      if (e.type==='cotested') { k=0.045; len=110; }   // 题群引力：组合出题边更强、更近，常考知识点抱团
      const f = k*(d-len)*alpha;
      const fx=dx/d*f, fy=dy/d*f;
      s.vx+=fx; s.vy+=fy; t2.vx-=fx; t2.vy-=fy;
    });
    // centering
    simNodes.forEach(n => { n.vx -= n.x*0.002*alpha; n.vy -= n.y*0.002*alpha; });
    // integrate + damping
    simNodes.forEach(n => {
      n.vx*=0.85; n.vy*=0.85;
      n.x+=n.vx; n.y+=n.vy;
      n._x=n.x; n._y=n.y;      // cache for rebuilds
    });
    alpha = Math.max(alpha*0.995, 0.02);
  }

  /* ---------- render ---------- */
  const gLinks = document.createElementNS('http://www.w3.org/2000/svg','g');
  const gNodes = document.createElementNS('http://www.w3.org/2000/svg','g');
  svg.appendChild(gLinks); svg.appendChild(gNodes);
  let view = { x:0, y:0, k:1 };
  const worldG = document.createElementNS('http://www.w3.org/2000/svg','g');
  // rebuild order: links under nodes inside one world group
  svg.appendChild(worldG);
  worldG.appendChild(gLinks); worldG.appendChild(gNodes);

  function applyView() {
    worldG.setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.k})`);
  }

  function render() {
    gLinks.innerHTML=''; gNodes.innerHTML='';
    const showSet = computeShowSet();

    // links
    simEdges.forEach(e => {
      if (!edgeVis[e.type]) return;          // 边类型开关：被关掉的不画
      const s=simNodes.find(x=>x.id===e.source), t2=simNodes.find(x=>x.id===e.target);
      if (!s || !t2) return;
      const isChild = e.type==='child';
      const def = G.meta.edgeTypes[e.type];
      let op;
      if (isChild) {
        op = 0.45;
      } else {
        const dimL = !(showSet.has(e.source) && showSet.has(e.target));
        op = dimL ? 0.06 : 0.5;
        if (focusId && op > 0.06) {
          // 焦点辐射：只高亮中心节点的边，其余淡出
          const on = e.source===focusId || e.target===focusId;
          op = on ? 0.9 : 0.06;
        }
      }
      const color = isChild ? '#64748b' : '#94a3b8';   // 边统一中性色，靠线型区分类型
      const w = e.type==='cotested' ? 2.6 : isChild ? 1 : 1.5;
      const dash = isChild ? '2 3' : (def.dash==='none' ? 'none' : def.dash);
      drawLink(s,t2,color,w,dash,op,e);
    });

    // nodes
    simNodes.forEach(s => {
      const visible = showSet.has(s.id);
      const r = s.level==='topic' ? (s.ref.weight==='high'?13:s.ref.weight==='mid'?11:9) : 7;
      // 颜色编码：课题层=范畴色；公式叶子=知识类型色（公式/定理/推论）
      const color = s.level==='topic' ? domColor(s.ref.domain) : ktColor(s.ref.knowledgeType);
      let dimmed = !visible;
      if (focusId && !dimmed) {
        // 焦点辐射：中心节点 + 其一阶邻居保持，其余淡出
        const isF = s.id===focusId;
        const isNei = simEdges.some(e => (e.source===focusId&&e.target===s.id)||(e.target===focusId&&e.source===s.id));
        if (!isF && !isNei) dimmed = true;
      }

      const gEl = document.createElementNS('http://www.w3.org/2000/svg','g');
      gEl.setAttribute('class','node'+(dimmed?' dim':''));
      gEl.dataset.id = s.id;

      // 边框颜色逻辑：频率高亮模式 vs 默认模式
      let strokeColor;
      if (frequencyHighlight && s.level==='topic' && s.ref.examFrequency !== undefined) {
        const freq = s.ref.examFrequency;
        // 频率映射到颜色：0=灰色, 1-4=浅红, 5-9=橙色, 10-13=深红
        if (freq === 0) strokeColor = '#64748b';
        else if (freq <= 4) strokeColor = '#fca5a5';
        else if (freq <= 9) strokeColor = '#f97316';
        else strokeColor = '#dc2626';
      }
      if (!strokeColor) {
        // 默认边框色
        strokeColor = dimmed ? '#475569' : (selected===s.id ? '#fff' : 'rgba(255,255,255,.35)');
      }

      const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
      c.setAttribute('r', r);
      c.setAttribute('fill', color);
      c.setAttribute('stroke', strokeColor);
      if (selected===s.id) c.setAttribute('stroke-width','2.5');
      gEl.appendChild(c);

      // 必背公式标记：dataSheet=true 的公式叶加金色外圈
      if (s.level==='leaf' && s.ref.dataSheet) {
        const ring = document.createElementNS('http://www.w3.org/2000/svg','circle');
        ring.setAttribute('r', r+3);
        ring.setAttribute('fill','none');
        ring.setAttribute('stroke','#fbbf24');
        ring.setAttribute('stroke-width','1.6');
        gEl.appendChild(ring);
      }

      // expand marker on topics
      if (s.level==='topic' && (s.ref.leaves||[]).length) {
        const mk = document.createElementNS('http://www.w3.org/2000/svg','circle');
        mk.setAttribute('cx', r*0.72); mk.setAttribute('cy', -r*0.72);
        mk.setAttribute('r', 3.4); mk.setAttribute('fill', expanded.has(s.id)?'#fbbf24':'#475569');
        gEl.appendChild(mk);
      }

      const label = document.createElementNS('http://www.w3.org/2000/svg','text');
      label.setAttribute('y', r+13);
      label.setAttribute('class', LANG==='en'?'en':'');
      label.textContent = short(nm(s.ref.name), LANG==='en'?20:10);
      gEl.appendChild(label);
      gEl.classList.toggle('dim', dimmed);
      if (!visible) label.classList.add('dim');

      // events
      gEl.addEventListener('click', ev => { ev.stopPropagation(); selectNode(s.id); });
      gEl.addEventListener('dblclick', ev => {
        ev.stopPropagation();
        if (s.level==='topic' && (s.ref.leaves||[]).length) {
          expanded.has(s.id) ? expanded.delete(s.id) : expanded.add(s.id);
          buildModel(); render();
          selectNode(s.id);
        }
      });
      gNodes.appendChild(gEl);
    });

    updateStats();
  }

  function drawLink(s,t2,color,w,dash,op,e) {
    if (!s || !t2) return;
    const ln = document.createElementNS('http://www.w3.org/2000/svg','line');
    ln.setAttribute('x1',s.x); ln.setAttribute('y1',s.y);
    ln.setAttribute('x2',t2.x); ln.setAttribute('y2',t2.y);
    if (e) { ln.dataset.from = e.source; ln.dataset.to = e.target; }
    ln.setAttribute('stroke',color);
    ln.setAttribute('stroke-width',w);
    if (dash && dash!=='none') ln.setAttribute('stroke-dasharray',dash);
    ln.setAttribute('class','link');
    ln.style.strokeOpacity = op;
    ln.addEventListener('click', ev => { ev.stopPropagation(); });
    gLinks.appendChild(ln);
  }

  /* ---------- visibility ---------- */
  function computeShowSet() {
    const set = new Set();
    simNodes.forEach(s => {
      if (s.level==='leaf') {
        // leaf visible only if its parent topic passes filters
        const p = G.nodes.find(n=>n.id===s.parent);
        if (p && visibleNode(p)) set.add(s.id);
      } else {
        if (visibleNode(s.ref)) set.add(s.id);
      }
    });
    return set;
  }

  function short(s, n) { return s.length>n ? s.slice(0,n)+'…' : s; }

  /* ---------- detail panel ---------- */
  function selectNode(id) {
    selected = id;
    // node could be topic or leaf
    let node=null, parentId=null;
    G.nodes.forEach(n => {
      if (n.id===id) node=n;
      (n.leaves||[]).forEach(l => { if (l.id===id) { node=l; parentId=n.id; } });
    });
    if (!node) { closeDetail(); return; }

    const isLeaf = !!parentId;
    focusId = isLeaf ? parentId : id;        // 焦点辐射：leaf 以其父课题为中心
    const color = isLeaf ? ktColor(node.knowledgeType) : domColor(node.domain);
    const typeStr = isLeaf ? (ktName(node.knowledgeType)||t('leafW')) : t('topic');
    const weightMap = T.weightMap[LANG];

    let html = `<div class="dhead" style="border-top:3px solid ${color}">
      <div class="dtype">${typeStr} · ${isLeaf ? domName(G.nodes.find(n=>n.id===parentId).domain) : domName(node.domain)}</div>
      <h2>${esc(nm(node.name))}</h2>
      <div class="en">${esc(nm({...node.name, zh:node.name.en, en:node.name.zh}))}</div>
      <div class="close" onclick="closeDetail()">×</div>
    </div>`;

    if (isLeaf) {
      if (node.formula) html += `<div class="sec"><h4>${t('formulas')}</h4>
        <div class="formula-box">${renderFormula(node.formula)}</div></div>`;
      if (node.pitfall) html += `<div class="sec"><h4>${t('pitfalls')}</h4>
        <div class="pitfall">⚠ ${esc(nm(node.pitfall))}</div></div>`;
    } else {
      // topic meta
      html += `<div class="sec"><div class="meta-row">
        <span class="tag2">${t('grade')}: ${node.grades.join(' / ')}</span>
        <span class="tag2">${t('weight')}: ${weightMap[node.weight] || '—'}</span>
        <span class="tag2">${t('difficulty')}: ${node.diff ? '★'.repeat(node.diff) : '—'}</span>
        ${node.examWeight ? `<span class="tag2" style="background:#16a34a22;color:#4ade80">${t('marks')}: ${node.examWeight}</span>` : ''}
      </div>`;

      // 考试频率 & 出题位置（如果有数据）
      if (node.examFrequency !== undefined || node.examSection) {
        html += `<div class="meta-row" style="margin-top:8px">`;
        if (node.examFrequency !== undefined) {
          const freq = node.examFrequency;
          const pct = Math.round((freq / 13) * 100);
          html += `<span class="tag2">${t('examFreq')}: ${freq}/13 年 (${pct}%)</span>`;
        }
        if (node.examSection) {
          html += `<span class="tag2">${t('examSec')}: Section ${node.examSection}</span>`;
        }
        html += `</div>`;

        // 频率进度条
        if (node.examFrequency !== undefined) {
          const freq = node.examFrequency;
          const barColor = freq >= 11 ? '#10b981' : freq >= 7 ? '#f59e0b' : '#64748b';
          html += `<div style="margin-top:6px;display:flex;align-items:center;gap:8px">
            <div style="flex:1;height:6px;background:#334155;border-radius:3px;overflow:hidden">
              <div style="width:${Math.round((freq/13)*100)}%;height:100%;background:${barColor};transition:width .3s"></div>
            </div>
            <span style="font-size:10px;color:var(--muted)">${freq}/13</span>
          </div>`;
        }
      }
      html += `</div>`;

      if (node.leaves && node.leaves.length) {
        html += `<div class="sec"><h4>${t('leaves')} (${node.leaves.length})</h4>`;
        node.leaves.forEach(l => {
          const kt = G.meta.knowledgeTypes[l.knowledgeType];
          html += `<div class="leafitem">
            <div><span class="fname">${esc(nm(l.name))}</span><span class="fen">${esc(nm({zh:l.name.en,en:l.name.zh}))}</span>
              ${kt?`<span class="kttag" style="background:${kt.color}22;color:${kt.color};border-color:${kt.color}">${kt[LANG]||kt.zh}</span>`:''}</div>
            ${l.formula?`<div class="fformula">${renderFormula(l.formula)}</div>`:''}
            ${l.pitfall?`<div class="fpit">⚠ ${esc(nm(l.pitfall))}</div>`:''}
          </div>`;
        });
        html += `</div>`;
      }
    }

    // mother problems（母题：核心特色）
    const topicId = isLeaf ? parentId : id;
    const asCore = (G.motherProblems||[]).filter(m => (m.coreTopics||[]).includes(topicId));
    const asRelated = (G.motherProblems||[]).filter(m => (m.relatedTopics||[]).includes(topicId));
    if (asCore.length || asRelated.length) {
      html += `<div class="sec"><h4>${t('motherP')}</h4>`;
      const renderMP = m => {
        const skel = m.solutionSkeleton || m.skeleton;
        const skelStr = Array.isArray(skel) ? skel.join(' → ') : String(skel||'').replace(/\n/g, ' → ');
        const vart = m.variation || m.variations;
        const varStr = Array.isArray(vart) ? vart.join('；') : String(vart||'');
        // 变式题（variants）：具体可刷的题，含题干+答案要点+难度
        const diffMap = { basic:'diffBasic', intermediate:'diffInt', challenge:'diffChal', comprehensive:'diffComp', calc:'diffCalc', concept:'diffConcept', experiment:'diffExp' };
        const variants = (m.variants||[]).map((v,i) => {
          const dt = t(diffMap[v.difficulty] || 'diffBasic');
          const dtColor = { basic:'#22c55e', intermediate:'#f59e0b', challenge:'#ef4444', comprehensive:'#a855f7', calc:'#3b82f6', concept:'#06b6d4', experiment:'#ec4899' }[v.difficulty] || '#94a3b8';
          const vstem = LANG==='zh' ? (v.stemZh||v.stemEn||'') : (v.stemEn||v.stemZh||'');
          const vans = LANG==='zh' ? (v.answerZh||v.answerEn||'') : (v.answerEn||v.answerZh||'');
          const yrs = (v.years||[]).length ? ` <span class="mp-vtag" style="border-color:#64748b;color:#94a3b8">${v.years.join('/')}</span>` : '';
          return `<div class="mp-v"><details>
            <summary>${t('variants')} ${i+1} <span class="mp-vtag" style="border-color:${dtColor};color:${dtColor}">${esc(dt)}</span>${yrs}</summary>
            <div class="vstem">${esc(vstem)}</div>
            <div class="vans">${t('vAnswer')}: ${esc(vans)}</div>
          </details></div>`;
        }).join('');
        return `
        <div class="mp">
          <div class="mp-title">${esc(LANG==='zh' ? m.titleZh : (m.titleEn||m.titleZh))}</div>
          ${m.stem ? `<div class="mp-stem">${t('stem')}: ${esc(LANG==='zh' ? m.stem : (m.stemEn||m.stem))}</div>` : ''}
          ${skelStr ? `<div class="mp-skel">${t('solution')}: ${esc(skelStr)}</div>` : ''}
          ${varStr ? `<div class="mp-var">${t('variation')}: ${esc(varStr)}</div>` : ''}
          ${variants ? `<div class="mp-variants">${variants}</div>` : ''}
        </div>`;
      };
      if (asCore.length) html += `<div class="mp-group">${t('asCore')}</div>` + asCore.map(renderMP).join('');
      if (asRelated.length) html += `<div class="mp-group">${t('asRelated')}</div>` + asRelated.map(renderMP).join('');
      html += `</div>`;
    }

    // relations (topic-level, from/to this node)
    const rels = G.edges.filter(e => e.from===id || e.to===id);
    if (rels.length) {
      html += `<div class="sec"><h4>${t('relations')}</h4>`;
      rels.forEach(e => {
        const other = e.from===id ? e.to : e.from;
        const on = G.nodes.find(n=>n.id===other);
        if (!on) return;
        const def = G.meta.edgeTypes[e.type];
        const dir = e.from===id ? '→' : '←';
        html += `<div class="relrow">
          <span class="rtype" style="color:${def.color||'#94a3b8'};border-color:${def.color||'#94a3b8'}">${def[LANG]||def.zh}${dir}</span>
          <span class="rname" data-goto="${other}">${esc(nm(on.name))}</span>
          ${e.evidence?`<div style="width:100%;font-size:11px;color:var(--muted);margin-top:2px;">📌 ${esc(e.evidence)}</div>`:''}
        </div>`;
      });
      html += `</div>`;
    } else if (!isLeaf) {
      html += `<div class="sec"><h4>${t('relations')}</h4><div class="statline">${t('noRel')}</div></div>`;
    }

    if (!isLeaf && (node.leaves||[]).length) {
      html += `<div class="sec"><button class="b" style="width:100%" onclick="toggleExpand('${node.id}')">
        ${expanded.has(node.id)?t('collapseHint'):t('expandHint')}</button></div>`;
    }

    detailEl.innerHTML = html;
    detailEl.style.display = 'block';
    // wire goto links
    detailEl.querySelectorAll('[data-goto]').forEach(el => {
      el.onclick = () => selectNode(el.dataset.goto);
    });
    render();
  }

  function closeDetail() { detailEl.style.display='none'; selected=null; focusId=null; render(); }
  window.closeDetail = closeDetail;
  window.toggleExpand = id => { expanded.has(id)?expanded.delete(id):expanded.add(id); buildModel(); render(); selectNode(id); };

  function renderFormula(f) {
    // naive TeX strip → unicode pretty print (KaTeX-free fallback)
    return esc(f)
      .replace(/\\\\/g,'⏎')
      .replace(/\\frac\{([^{}]+)\}\{([^{}]+)\}/g,'($1)/($2)')
      .replace(/\\sqrt\{([^{}]+)\}/g,'√($1)')
      .replace(/\\Delta/g,'Δ').replace(/\\alpha/g,'α').replace(/\\beta/g,'β')
      .replace(/\\theta/g,'θ').replace(/\\pi/g,'π').replace(/\\pm/g,'±')
      .replace(/\\times/g,'×').replace(/\\cdot/g,'·').replace(/\\neq/g,'≠')
      .replace(/\\leq/g,'≤').replace(/\\geq/g,'≥').replace(/\\infty/g,'∞')
      .replace(/\\lim_\{([^{}]*)\}/g,'lim_($1)')
      .replace(/\\sum_\{([^{}]*)\}\^\{([^{}]*)\}/g,'Σ($1→$2)')
      .replace(/\\int_\{([^{}]*)\}\^\{([^{}]*)\}/g,'∫($1→$2)')
      .replace(/\\int/g,'∫').replace(/\\to/g,'→').replace(/\\iff/g,'⇔')
      .replace(/\\Rightarrow/g,'⇒').replace(/\\left|\\right/g,'')
      // 三角函数与常用物理符号（必须在最后的 \\[a-zA-Z]+ 兜底删除之前）
      .replace(/\\sinh/g,' sinh ').replace(/\\cosh/g,' cosh ').replace(/\\tanh/g,' tanh ')
      .replace(/\\arcsin/g,' arcsin ').replace(/\\arccos/g,' arccos ').replace(/\\arctan/g,' arctan ')
      .replace(/\\sin/g,' sin ').replace(/\\cos/g,' cos ').replace(/\\tan/g,' tan ')
      .replace(/\\propto/g,'∝').replace(/\\approx/g,'≈').replace(/\\circ/g,'°')
      .replace(/\\mu/g,'μ').replace(/\\omega/g,'ω').replace(/\\Omega/g,'Ω')
      .replace(/\\lambda/g,'λ').replace(/\\rho/g,'ρ').replace(/\\gamma/g,'γ').replace(/\\phi/g,'φ')
      .replace(/\\vec\{([^{}]*)\}/g,'$1').replace(/\\bar\{([^{}]*)\}/g,'$1')
      .replace(/\\quad/g,'  ').replace(/\\,/g,' ').replace(/\\;/g,' ').replace(/\\!/g,'')
      .replace(/\\text\{([^{}]*)\}/g,'$1')
      .replace(/\\begin\{pmatrix\}([^]*)\\end\{pmatrix\}/g, m => m)
      .replace(/\\[a-zA-Z]+/g,'')
      .replace(/[{}]/g,'')
      .replace(/\^\{([^{}]+)\}/g,'^($1)')
      .replace(/_\{([^{}]+)\}/g,'_($1)');
  }
  function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  /* ---------- stats & legend ---------- */
  function updateStats() {
    const showSet = computeShowSet();
    const topics = simNodes.filter(s=>s.level==='topic' && showSet.has(s.id)).length;
    const leaves = simNodes.filter(s=>s.level==='leaf').length;
    const shown = simEdges.filter(e=>e.type!=='child' && showSet.has(e.source)&&showSet.has(e.target)).length;
    document.getElementById('stats').innerHTML =
      `${t('nodesShown')}: <b>${topics}</b> ${t('topicsWord')} · <b>${leaves}</b> ${t('leavesWord')} · <b>${shown}</b> ${t('edgesWord')}<br>` +
      `<span style="opacity:.7">${G.meta.version} · ${G.meta.updated}</span>`;
  }

  function buildLegend() {
    const lg = document.getElementById('legend');
    let h = `<div class="lg-cap">${t('domainT')} · ${t('topic')}</div>`;
    G.domains.forEach(d => {
      h += `<div class="li"><span class="dot" style="background:${d.color}"></span> ${nm(d.code)}` +
        (d.marksRange ? ` <span style="font-size:10px;color:var(--muted)">${d.marksRange}</span>` : '') +
        `</div>`;
    });
    h += `<div class="lg-cap">${LANG==='zh'?'知识类型':'Knowledge type'} · ${t('leafW')}</div>`;
    Object.entries(G.meta.knowledgeTypes).forEach(([k,v]) => {
      h += `<div class="li"><span class="dot" style="background:${v.color}"></span> ${v[LANG]||v.zh}</div>`;
    });
    h += `<div class="lg-cap">${t('edgeT')}</div>`;
    Object.entries(G.meta.edgeTypes).forEach(([k,v]) => {
      const on = edgeVis[k];
      h += `<div class="li edge-toggle ${on?'':'off'}" data-edge="${k}">
        <svg><line x1="0" y1="5" x2="26" y2="5" stroke="#94a3b8" stroke-width="${k==='cotested'?3:2}" ${v.dash!=='none'?`stroke-dasharray="${v.dash}"`:''}/></svg>
        <span>${v[LANG]||v.zh}</span></div>`;
    });
    h += `<div class="li edge-toggle ${edgeVis.child?'':'off'}" data-edge="child">
      <svg><line x1="0" y1="5" x2="26" y2="5" stroke="#64748b" stroke-width="1" stroke-dasharray="2 3"/></svg>
      <span>${LANG==='zh'?'下钻·公式叶':'leaf link'}</span></div>`;

    // 频率高亮模式切换
    h += `<div class="lg-cap" style="margin-top:8px">${t('edgeToggle')}</div>`;
    h += `<div class="li edge-toggle ${frequencyHighlight?'':'off'}" data-freq-highlight="1">
      <div style="width:14px;height:14px;border:2px solid;border-radius:50%;margin-right:6px;
        border-color:${frequencyHighlight?'#10b981':'#94a3b8'}"></div>
      <span>${t('freqHighlight')}</span>
    </div>`;
    if (frequencyHighlight) {
      h += `<div class="li" style="font-size:10px;color:var(--muted);padding-left:22px">
        ${t('freqHighlightHint')}
      </div>`;
    }
    // 新手模式切换
    h += `<div class="li edge-toggle ${beginnerMode?'':'off'}" data-beginner="1">
      <div style="width:14px;height:14px;border:2px solid;border-radius:3px;margin-right:6px;${beginnerMode?'background:#10b981;border-color:#10b981':'border-color:#94a3b8'}"></div>
      <span>${t('beginnerMode')}</span>
    </div>`;
    if (beginnerMode) {
      h += `<div class="li" style="font-size:10px;color:var(--muted);padding-left:22px">
        ${t('beginnerHint')}
      </div>`;
    }
    lg.innerHTML = h;
    lg.querySelectorAll('.edge-toggle').forEach(el => {
      el.onclick = () => {
        const k = el.dataset.edge;
        edgeVis[k] = !edgeVis[k];
        buildLegend(); render();
      };
    });
    // 频率高亮切换
    lg.querySelectorAll('[data-freq-highlight]').forEach(el => {
      el.onclick = () => {
        frequencyHighlight = !frequencyHighlight;
        buildLegend(); render();
      };
    });
    // 新手模式切换
    lg.querySelectorAll('[data-beginner]').forEach(el => {
      el.onclick = () => {
        beginnerMode = !beginnerMode;
        expanded.clear(); selected=null; closeDetail();
        buildModel(); render(); buildLegend();
      };
    });
  }

  /* ---------- pan & zoom ---------- */
  let dragging=false, lastX=0, lastY=0, moved=false;
  svg.addEventListener('mousedown', e => { dragging=true; moved=false; lastX=e.clientX; lastY=e.clientY; });
  window.addEventListener('mouseup', () => dragging=false);
  svg.addEventListener('mousemove', e => {
    if (!dragging) return;
    const dx=e.clientX-lastX, dy=e.clientY-lastY;
    if (Math.abs(dx)+Math.abs(dy)>3) moved=true;
    view.x+=dx; view.y+=dy; lastX=e.clientX; lastY=e.clientY; applyView();
  });
  svg.addEventListener('click', e => { if (e.target===svg && !moved) closeDetail(); });
  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const f = e.deltaY<0 ? 1.12 : 1/1.12;
    const rect = svg.getBoundingClientRect();
    const mx = e.clientX-rect.left, my = e.clientY-rect.top;
    view.k = Math.min(3, Math.max(0.25, view.k*f));
    view.x = mx - (mx-view.x)*f;
    view.y = my - (my-view.y)*f;
    applyView();
  }, {passive:false});
  /* touch: pinch zoom + one-finger pan */
  let touchState = null;
  svg.addEventListener('touchstart', e => {
    if (e.touches.length===1) { touchState={mode:'pan',x:e.touches[0].clientX,y:e.touches[0].clientY}; }
    else if (e.touches.length===2) {
      const dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY;
      touchState={mode:'pinch',d:Math.hypot(dx,dy),cx:(e.touches[0].clientX+e.touches[1].clientX)/2,cy:(e.touches[0].clientY+e.touches[1].clientY)/2};
    }
  }, {passive:true});
  svg.addEventListener('touchmove', e => {
    if (!touchState) return;
    e.preventDefault();
    if (touchState.mode==='pan' && e.touches.length===1) {
      view.x += e.touches[0].clientX-touchState.x; view.y += e.touches[0].clientY-touchState.y;
      touchState.x=e.touches[0].clientX; touchState.y=e.touches[0].clientY; applyView();
    } else if (touchState.mode==='pinch' && e.touches.length===2) {
      const dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY;
      const d=Math.hypot(dx,dy), rect=svg.getBoundingClientRect();
      const cx=(e.touches[0].clientX+e.touches[1].clientX)/2-rect.left, cy=(e.touches[0].clientY+e.touches[1].clientY)/2-rect.top;
      const f=d/touchState.d;
      view.k=Math.min(3,Math.max(0.25,view.k*f));
      view.x=cx-(cx-view.x)*f; view.y=cy-(cy-view.y)*f;
      touchState.d=d; applyView();
    }
  }, {passive:false});

  /* ---------- controls ---------- */
  document.getElementById('module-btns').addEventListener('click', e => {
    const b = e.target.closest('button.b'); if(!b) return;
    moduleView = b.dataset.mod;
    document.querySelectorAll('#module-btns .b').forEach(x=>x.classList.toggle('on', x===b));
    expanded.clear(); selected=null; closeDetail();
    buildModel(); render();
  });

  document.getElementById('grade-chips').addEventListener('click', e => {
    const c = e.target.closest('.chip'); if(!c) return;
    const g = c.dataset.grade;
    if (grades.has(g)) { if (grades.size>1) grades.delete(g); } else grades.add(g);
    c.classList.toggle('on', grades.has(g));
    render();
  });

  document.getElementById('lang-zh').onclick = () => setLang('zh');
  document.getElementById('lang-en').onclick = () => setLang('en');
  function setLang(l) {
    LANG = l;
    document.getElementById('lang-zh').classList.toggle('on', l==='zh');
    document.getElementById('lang-en').classList.toggle('on', l==='en');
    document.getElementById('ui-title').textContent = l==='zh' ? 'DSE 化学 · 全景知识图谱' : 'DSE Chemistry · Knowledge Graph Atlas';
    document.getElementById('ui-sub').innerHTML = l==='zh'
      ? '必修(12單元) + 選修(3選2) + SBA · 课题级骨架<br>点击节点看详情 · 双击课题下钻公式'
      : 'Compulsory + Elective + SBA · topic skeleton<br>click node = details · dbl-click topic = formulas';
    document.getElementById('ui-t-view').textContent = t('viewModule');
    document.getElementById('ui-t-filter').textContent = t('gradeFilter');
    document.getElementById('ui-t-search').textContent = t('search');
    document.getElementById('ui-t-legend').textContent = t('legendT');
    document.getElementById('search').placeholder = T.searchPh[l];
    document.getElementById('hint').textContent = T.hint[l];
    buildLegend();
    if (selected) selectNode(selected); else render();
  }

  /* search: locate & select first match */
  document.getElementById('search').addEventListener('keydown', e => {
    if (e.key!=='Enter') return;
    const q = e.target.value.trim().toLowerCase();
    if (!q) return;
    let hit=null;
    for (const n of G.nodes) {
      if (!visibleNode(n)) continue;
      if (n.name.zh.toLowerCase().includes(q) || n.name.en.toLowerCase().includes(q)) { hit=n.id; break; }
      if ((n.leaves||[]).some(l => (l.name.zh+l.name.en).toLowerCase().includes(q))) { hit=n.id; break; }
    }
    if (hit) {
      expanded.add(hit); buildModel(); render();
      // center on it
      const s = simNodes.find(x=>x.id===hit);
      if (s) { const r=svg.getBoundingClientRect(); view.x = r.width/2 - s.x; view.y = r.height/2 - s.y; applyView(); }
      selectNode(hit);
    }
  });

  /* ---------- animation loop ---------- */
  function loop() { tick(); draw(); requestAnimationFrame(loop); }
  function draw() {
    // update positions only (attrs), cheap
    gNodes.childNodes.forEach(gEl => {
      const s = simNodes.find(x=>x.id===gEl.dataset.id);
      if (s) gEl.setAttribute('transform',`translate(${s.x},${s.y})`);
    });
    gLinks.childNodes.forEach(ln => {
      const s=simNodes.find(x=>x.id===ln.dataset.from), t2=simNodes.find(x=>x.id===ln.dataset.to);
      if (s&&t2){ ln.setAttribute('x1',s.x); ln.setAttribute('y1',s.y); ln.setAttribute('x2',t2.x); ln.setAttribute('y2',t2.y); }
    });
  }

  /* ---------- boot ---------- */
  buildModel(); render(); buildLegend(); applyView();
  // slight initial separation by domain for faster convergence
  simNodes.forEach(s => {
    const ang = { 'CH-STRUCT':Math.PI*0.0, 'CH-INORG':Math.PI*0.7, 'CH-REACT':Math.PI*1.4, 'CH-CARBON':Math.PI*2.1, 'CH-PATTERN':Math.PI*2.8, 'CH-IND':Math.PI*3.5, 'CH-MAT':Math.PI*4.2, 'CH-ANA':Math.PI*4.9, 'CH-LAB':Math.PI*5.6 }[s.ref.domain] || (Math.random()*Math.PI*2);
    s.x = 200*Math.cos(ang) + (Math.random()-.5)*120;
    s.y = 140*Math.sin(ang) + (Math.random()-.5)*120;
  });
  loop();
})();
</script>
</body>
</html>
